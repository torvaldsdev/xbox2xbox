name: Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - .github/workflows/pages-progress.yml
      - tools/progress.py
      - tools/progress_history.py
      - tools/rdna_isa.txt
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Measure current progress
        run: python3 tools/progress.py "$RUNNER_TEMP/site"
      - name: Measure progress history
        run: python3 tools/progress_history.py "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v5